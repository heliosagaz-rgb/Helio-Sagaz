<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLean - Emagreça com Saúde, Treinos e Nutrição</title>
    <meta name="description" content="Plataforma moderna de emagrecimento, treinos personalizados, alimentação saudável e acompanhamento de progresso." />
    <meta property="og:title" content="FitLean - Emagreça com Saúde, Treinos e Nutrição" />
    <meta property="og:description" content="Plataforma moderna de emagrecimento, treinos personalizados, alimentação saudável e acompanhamento de progresso." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('fitlean_theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && supportDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
